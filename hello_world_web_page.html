<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Modern Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .pulse-glow {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-12 text-white antialiased overflow-x-hidden">

    <main class="w-full max-w-xl mx-auto">
        <!-- Main Glass Card -->
        <div class="glass-card rounded-3xl p-8 sm:p-12 shadow-2xl text-center transform transition-all duration-300 hover:scale-[1.01] relative overflow-hidden">
            
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Header Badge -->
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/20 border border-white/30 text-xs sm:text-sm font-medium tracking-wide mb-6 uppercase backdrop-blur-md">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Web Starter Template
            </div>

            <!-- Main Heading -->
            <h1 class="text-5xl sm:text-7xl font-extrabold tracking-tight mb-4 drop-shadow-md bg-clip-text text-transparent bg-gradient-to-r from-white via-white/90 to-white/70">
                Hello World!
            </h1>

            <!-- Subtitle -->
            <p class="text-base sm:text-xl text-white/80 font-light mb-8 max-w-md mx-auto leading-relaxed">
                Welcome to your beautifully crafted single-page application. Built with Tailwind CSS, smooth mesh animations, and modern responsive design.
            </p>

            <!-- Interactive Counter / Button Area -->
            <div class="bg-black/10 rounded-2xl p-6 backdrop-blur-sm border border-white/10 mb-8">
                <p class="text-sm font-medium text-white/70 mb-3">Interactive Greeting Counter</p>
                <div class="text-4xl font-extrabold mb-4 font-mono" id="counter">0</div>
                
                <div class="flex flex-wrap justify-center gap-3">
                    <button id="increment-btn" class="px-5 py-2.5 rounded-xl bg-white text-gray-900 font-semibold shadow-lg hover:bg-opacity-90 active:scale-95 transition-all duration-200 flex items-center gap-2">
                        <i class="fa-solid fa-hand-wave text-amber-500"></i> Say Hello
                    </button>
                    <button id="reset-btn" class="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white font-medium border border-white/20 active:scale-95 transition-all duration-200">
                        Reset
                    </button>
                </div>
            </div>

            <div class="flex justify-center items-center gap-6 text-white/70 hover:text-white transition-colors">
                <a href="#" class="p-2.5 rounded-full hover:bg-white/10 transition-all hover:scale-110" title="GitHub">
                    <i class="fa-brands fa-github text-xl"></i>
                </a>
                <a href="#" class="p-2.5 rounded-full hover:bg-white/10 transition-all hover:scale-110" title="Twitter">
                    <i class="fa-brands fa-x-twitter text-xl"></i>
                </a>
                <a href="#" class="p-2.5 rounded-full hover:bg-white/10 transition-all hover:scale-110" title="Discord">
                    <i class="fa-brands fa-discord text-xl"></i>
                </a>
            </div>

            <footer class="mt-8 text-xs text-white/50 border-t border-white/10 pt-4">
                Designed with precision &bull; Everything in a single page
            </footer>
        </div>
    </main>

    <script>
        // Interactive greeting counter logic
        let count = 0;
        const counterEl = document.getElementById('counter');
        const incrementBtn = document.getElementById('increment-btn');
        const resetBtn = document.getElementById('reset-btn');

        incrementBtn.addEventListener('click', () => {
            count++;
            counterEl.textContent = count;
            
            // Subtle animation feedback on click
            counterEl.classList.add('scale-125', 'text-yellow-300');
            setTimeout(() => {
                counterEl.classList.remove('scale-125', 'text-yellow-300');
            }, 150);
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            counterEl.textContent = count;
        });
    </script>
</body>
</html>
